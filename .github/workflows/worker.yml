name: Background Sheet Worker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'
            # cache: 'pip'

      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - name: Run worker script
        env:
            Aunty_NEXT_DOOR_API_PRIMARY: ${{ secrets.Aunty_NEXT_DOOR_API_PRIMARY }}
            GROQ_API_KEY_SECONDARY_2: ${{ secrets.GROQ_API_KEY_SECONDARY_2 }}
            GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
            python worker.py
