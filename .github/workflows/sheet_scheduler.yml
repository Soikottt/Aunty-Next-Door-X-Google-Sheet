name: Sheet sync and process

on:
  schedule:
    - cron: "*/5 * * * *"          # every 5 minutes (GitHub does not allow faster)
  workflow_dispatch: {}           # also lets you run it by hand from the Actions tab

concurrency:
  group: sheet-scheduler          # never two runs at the same time
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20            # a stuck run is stopped after 25 minutes at most
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-scheduler.txt

      - name: Install ffmpeg (for audio)
        id: ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3       # downloads a ready ffmpeg, no slow apt-get
        timeout-minutes: 3
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: ffmpeg fallback (only if the step above failed)
        if: steps.ffmpeg.outcome != 'success'
        timeout-minutes: 4
        run: command -v ffmpeg >/dev/null || sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python packages
        run: pip install -r requirements-scheduler.txt

      - name: Today (UTC)
        id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore today's usage counters
        uses: actions/cache/restore@v4
        with:
          path: api_usage.json
          key: usage-${{ steps.day.outputs.date }}-${{ github.run_id }}
          restore-keys: usage-${{ steps.day.outputs.date }}-

      - name: VOIP / line type check
        continue-on-error: true        # a VOIP problem never blocks the QC step below
        timeout-minutes: 8
        env:
          STREAMLIT_SECRETS: ${{ secrets.STREAMLIT_SECRETS }}
          VERIPHONE_API_KEYS: ${{ secrets.VERIPHONE_API_KEYS }}
          VOIP_ENV: ${{ secrets.VOIP_ENV }}
        run: python voip_run.py

      - name: Run sheet sync and process
        timeout-minutes: 15            # rows not finished are picked up again by the next run
        env:
          STREAMLIT_SECRETS: ${{ secrets.STREAMLIT_SECRETS }}
          APP_FILE: app.py
          DEFAULT_CAMPAIGN: ""
        run: python scheduler_run.py

      - name: Save today's usage counters
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: api_usage.json
          key: usage-${{ steps.day.outputs.date }}-${{ github.run_id }}
